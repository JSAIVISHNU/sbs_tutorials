services:
  - type: web
    name: brilliant-hub
    runtime: static
    buildCommand: npm install --no-audit && npm run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: true
    envVars:
      - key: NODE_VERSION
        value: 20
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
